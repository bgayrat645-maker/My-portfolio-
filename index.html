<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ğayrat — Portfolio</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #0B0F14;
      --text-color: #E6EDF3;
      --text-muted: #8B949E;
      --card-bg: #161B22;
      --border-color: #30363D;
      --accent-teal: #2DD4BF;
      --accent-amber: #F59E0B;
      --terminal-header: #21262D;
      --code-color: #A5D6FF;
      --shadow-color: rgba(0, 0, 0, 0.4);
    }

    body.light-mode {
      --bg-color: #FFFFFF;
      --text-color: #0F172A;
      --text-muted: #64748B;
      --card-bg: #F8FAFC;
      --border-color: #E2E8F0;
      --terminal-header: #E2E8F0;
      --code-color: #0969DA;
      --shadow-color: rgba(0, 0, 0, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: 'Inter', sans-serif;
      line-height: 1.6;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    h1, h2, h3, .mono {
      font-family: 'JetBrains Mono', monospace;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
    }

    /* Floating Tema Almashtirish Tugmasi */
    .floating-theme-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      width: 42px;
      height: 42px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      z-index: 1000;
      box-shadow: 0 4px 12px var(--shadow-color);
      transition: all 0.2s ease;
    }

    .floating-theme-btn:hover {
      border-color: var(--accent-teal);
      transform: scale(1.05);
    }

    /* Hero Section */
    .hero-section {
      padding: 60px 0 80px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 40px;
    }

    .hero-content {
      flex: 1;
    }

    .avatar-placeholder {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: var(--card-bg);
      border: 2px solid var(--accent-teal);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      margin-bottom: 20px;
      overflow: hidden;
    }

    .hero-title {
      font-size: 2.5rem;
      margin-bottom: 10px;
    }

    .hero-title span {
      color: var(--accent-amber);
    }

    .hero-subtitle {
      color: var(--text-muted);
      font-size: 1.1rem;
      margin-bottom: 30px;
    }

    .hero-buttons {
      display: flex;
      gap: 15px;
    }

    .btn {
      padding: 10px 24px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 500;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.9rem;
      transition: all 0.2s ease;
      display: inline-block;
      cursor: pointer;
    }

    .btn-primary {
      background: var(--accent-teal);
      color: #0B0F14;
      border: 1px solid var(--accent-teal);
    }

    .btn-primary:hover {
      opacity: 0.9;
    }

    /* Terminal */
    .hero-terminal {
      flex: 1;
      min-width: 300px;
    }

    .terminal-window {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      box-shadow: 0 10px 30px var(--shadow-color);
      overflow: hidden;
    }

    .terminal-header {
      background-color: var(--terminal-header);
      padding: 10px 15px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
